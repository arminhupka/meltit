*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 13%,#35413c 0,#151d1d 65%)}
button,select,input{font:inherit;color:inherit}
button,select{cursor:pointer}
button{border:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.instrument{width:min(100%,1170px);background:#283635;border:1px solid #65716a;border-radius:18px;overflow:hidden;box-shadow:0 25px 72px #0009,inset 0 1px #fff3}
.top{min-height:70px;display:flex;gap:20px;align-items:center;padding:13px 22px;background:#172122;border-bottom:1px solid #070a0a}
.mark{display:flex;align-items:center;gap:12px;flex:1;font-family:"Arial Narrow","Segoe UI",sans-serif;font-weight:900;font-size:clamp(18px,3vw,28px);letter-spacing:-.065em;white-space:nowrap}
.mark::before{content:"";width:30px;height:26px;background:linear-gradient(160deg,transparent 12%,#e8b55e 12% 31%,transparent 31% 40%,#df895b 40% 60%,transparent 60% 70%,#b75d45 70% 85%,transparent 85%);clip-path:polygon(0 0,100% 0,100% 72%,70% 100%,0 100%);flex:0 0 auto}
.preset{display:flex;align-items:center;gap:8px;min-width:0}
.screen, .generate{min-height:39px;border-radius:5px;padding:0 13px;font-size:14px;font-weight:650}
.screen{width:190px;background:#0d1717;border:1px solid #53605b;color:var(--ink)}
.generate{background:var(--glow);color:#271a13;border:1px solid #f0cd89}
.generate:hover{background:#ffd28a}
.board{min-height:473px;background:linear-gradient(143deg,#42514b,#2a3937 72%);padding:19px 19px 12px}
.shelf h2{margin:0;font-size:14px;font-weight:800;letter-spacing:.055em;text-transform:uppercase}
.flow{display:flex;align-items:center;gap:14px;color:#f1e5c8;font:700 11px Consolas,monospace;letter-spacing:.13em;text-transform:uppercase;padding:0 8px 12px;border-bottom:1px solid #73807762}
.flow-line{flex:1;position:relative;height:1px;background:linear-gradient(90deg,#8d9f89,#acb39a)}
.flow-line::after{content:"";position:absolute;right:0;top:-4px;width:8px;height:8px;border-top:1px solid #d0ccad;border-right:1px solid #d0ccad;transform:rotate(45deg)}
.rack-scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#68786d transparent;min-width:0}
.rack{min-height:402px;min-width:100%;width:max-content;display:flex;align-items:flex-start;justify-content:center;gap:23px;padding:17px 7px 13px}
.empty-rack{width:min(440px,calc(100vw - 74px));min-height:168px;margin-top:67px;display:grid;place-items:center;border:1px dashed #a7b19d;border-radius:14px;background:#24353155;color:#f1e5c8;font-weight:650;letter-spacing:.015em;padding:15px;text-align:center}
.empty-rack.over,.add-slot.over,.slot.over{border-color:var(--glow);box-shadow:0 0 0 3px #e8b55e62}
.slot-shell{width:251px;flex:0 0 auto;position:relative}
.slot-shell:has(+ .slot-shell)::after{content:"→";position:absolute;left:100%;width:23px;text-align:center;top:55px;color:#e7d3a6;font-size:17px;pointer-events:none}
.slot-shell.before::before,.slot-shell.after::before{content:"";position:absolute;top:0;bottom:0;width:3px;border-radius:3px;background:var(--glow);left:-6px;z-index:1}
.slot-shell.after::before{left:auto;right:-6px}
.add-slot{width:107px;height:138px;flex:0 0 auto;border-radius:17px;background:#f9f4df12;border:1px solid #c9d6c273;color:#f2ead6;display:grid;align-content:center;justify-items:center;gap:4px}
.add-slot:hover{background:#f9f4df22;border-color:#c9d6c2b0}
.plus{font:300 49px/1 "Segoe UI",Arial,sans-serif}
.add-caption{font-size:12px;font-weight:650}
.dot{width:7px;height:7px;border-radius:100%;background:var(--accent);flex:0 0 auto;margin-right:7px}
.slot{width:100%;height:138px;position:relative;padding:6px 13px 9px;display:grid;grid-template-rows:22px 1fr;gap:4px;background:linear-gradient(178deg,#263332,#1a2524);border:1px solid #62706a;border-radius:12px 12px 9px 9px;box-shadow:inset 0 1px #fcf7e325,0 5px 7px #142020aa}
.slot::before,.slot::after{content:"";position:absolute;top:75px;width:4px;height:33px;background:repeating-linear-gradient(180deg,#6f7c72 0 1px,#2b3735 1px 4px)}
.slot::before{left:5px}.slot::after{right:5px}
.slot-label{display:flex;align-items:center;gap:8px;min-width:0;color:#d3d4bf;font:700 10px Consolas,monospace;letter-spacing:.12em;text-transform:uppercase}
.slot-label span{flex:1}
.slot-label button{display:grid;place-items:center;background:#f6f2dc13;color:#eae7cf;border-radius:4px;width:23px;height:22px;font:15px/1 "Segoe UI",sans-serif}
.slot-label .grip{cursor:grab}
.slot-label button:hover{background:#f6f2dc30}
.mouth{overflow:hidden;border-radius:6px;background:#0b1515;box-shadow:inset 0 7px 12px #000d;border:1px solid #10191a;display:grid;place-items:center;padding:0 13px}
.slot-hint{font-size:14px;text-align:center;color:#c7d5c7}
.mounted{width:min(100%,178px);height:96px;transform:translateY(9px);background:#a4a89d;border-radius:6px 13px 0 0;padding:6px 8px 0;box-shadow:inset 0 1px #fff8,0 0 12px #000;display:grid;gap:5px;pointer-events:none}
.mounted[hidden],.slot-hint[hidden]{display:none}
.mount-grip{height:12px;justify-self:center;width:58%;background:#657068;border-radius:4px 4px 8px 8px;box-shadow:inset 0 2px 3px #0006}
.mount-art{height:66px;border:2px solid #686e62;border-radius:3px 5px 2px 2px;position:relative}
.mount-art strong{position:absolute;bottom:9px;left:8px;font-size:18px;color:#fff5df;background:#172424e8;padding:2px 7px}
.drawer{width:100%;margin-top:8px;background:#e4dfcb;color:#26302e;border:1px solid #fbf5df;border-radius:8px 8px 12px 12px;padding:10px 12px 12px;box-shadow:0 8px 14px #17232299,inset 0 -2px #a9aa98;transform-origin:50% 0;min-width:0}
.drawer[hidden]{display:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #b1b5a5;padding-bottom:8px}
.module-name{display:flex;align-items:center;gap:10px}
.module-name .dot{width:10px;height:10px;margin:0;border:1px solid #24302d44}
.module-name h2{margin:0;font-size:18px;letter-spacing:-.03em}
.mode-select{max-width:95px;padding:4px 5px;border-radius:4px;border:1px solid #929b89;background:#f3ecd9;color:#26302e;font-size:12px}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding-top:10px;gap:9px 6px}
.dial{min-width:0;display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:700;text-align:center}
.ring{--fill:43%;--needle:0deg;width:min(100%,53px);aspect-ratio:1;position:relative;border-radius:50%;background:conic-gradient(from 222deg,var(--accent) 0 var(--fill),#aeb3a3 var(--fill) 77%,transparent 77%);display:grid;place-items:center;margin-bottom:1px}
.cap{position:absolute;inset:6px;border-radius:50%;background:linear-gradient(148deg,#616e63,#283633 76%);border:1px solid #172422;box-shadow:inset 0 1px #fff6,0 3px 5px #25302d77;transform:rotate(var(--needle))}
.cap::after{content:"";height:25%;width:3px;border-radius:3px;background:#f1eed3;position:absolute;top:8%;left:calc(50% - 1.5px)}
.dial input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.ring:focus-within{outline:2px solid #525d47;outline-offset:3px}
.dial output{background:#2c3836;color:var(--ink);padding:3px 7px;min-width:58px;border-radius:3px;font:12px Consolas,monospace}
.shelf{border-top:1px solid #69736a;padding:13px 18px 13px;background:linear-gradient(#243131,#182323)}
.shelf-header{display:flex;align-items:center;justify-content:space-between;padding:0 5px 5px;color:#e8dfc5}
.shelf-header span{font:12px Consolas,monospace;color:var(--dim)}
.tray{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:9px;align-items:center}
.tray nav button,.shelf-arrow{width:34px;height:36px;color:#ede1c3;background:#2d3c39;border:1px solid #53615b;border-radius:5px;font-size:21px;line-height:1}
.shelf-arrow:disabled{opacity:.37;cursor:default}
.cartridges{display:grid;grid-auto-columns:clamp(124px,14vw,151px);grid-auto-flow:column;gap:12px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#64736b transparent;padding:7px 3px 10px;scroll-snap-type:x proximity}
.cartridge{padding:6px 8px 7px;border-radius:8px 5px 6px 6px;position:relative;appearance:none;scroll-snap-align:start;cursor:grab;text-align:left;background:linear-gradient(145deg,#bbbbb1,#929b93 92%);box-shadow:inset 0 1px #f2eee4aa,inset 0 -2px #545d55,0 4px 6px #0008;border:1px solid #bfc5b4;color:#192522;display:grid;gap:6px;transition:transform .16s ease,filter .16s ease}
.cartridge:hover,.cartridge:focus-visible{transform:translateY(-4px);filter:brightness(1.09)}
.cartridge.selected{box-shadow:inset 0 0 0 2px var(--accent),0 4px 6px #0008}
.cartridge:active{cursor:grabbing}
.case-grip{height:15px;border-radius:10px;background:linear-gradient(#657067,#748176 65%,#a3a89e);border:1px solid #aeb4a9;box-shadow:inset 0 2px 4px #0006;margin:0 10px;position:relative}
.case-grip::before,.case-grip::after{content:"";width:7px;height:12px;position:absolute;top:1px;background:repeating-linear-gradient(180deg,#727d72 0 1px,#c0c2b6 1px 3px)}
.case-grip::before{left:-9px}.case-grip::after{right:-9px}
.art{background-image:var(--art);background-size:400% 200%;background-position:var(--x) var(--y);background-repeat:no-repeat;background-color:#343c39}
.label-art{height:67px;display:block;border:2px solid #60685d;border-radius:3px;box-shadow:0 1px #c6c8b8}
.cart-name{min-width:0;font-family:"Arial Narrow","Segoe UI",sans-serif;font-weight:900;font-size:13px;letter-spacing:.015em;text-transform:uppercase;line-height:16px;white-space:nowrap;padding:0 2px;overflow:hidden;text-overflow:ellipsis}
.cart-name::after{content:"";display:block;height:3px;background:var(--accent);margin-top:3px;clip-path:polygon(0 0,100% 0,95% 100%,0 100%)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(max-width:740px){body{padding:12px}.top{padding:11px 13px;gap:8px;flex-wrap:wrap}.preset{flex-wrap:wrap}.screen{width:150px}.board{padding:14px 9px 8px}.shelf{padding:9px}.slot-shell{width:222px}.add-slot{width:80px}}
@media(max-width:490px){body{padding:6px}.instrument{border-radius:11px}.top,.preset{gap:7px}.top .mark{width:100%;flex:none}.screen{width:150px}.shelf h2{font-size:12px}.tray{gap:5px}.board{min-height:423px}.rack{min-height:383px;gap:14px}.slot-shell:has(+ .slot-shell)::after{width:14px}.slot-shell{width:218px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
<main class="instrument" aria-label="Tape Multi-FX">
  <header class="top">
    <div class="mark">TAPE MULTI-FX</div>
    <div class="preset"><select class="screen" id="presets" aria-label="Preset"></select><button class="generate" id="generate">Generate</button></div>
  </header>
  <section class="board" aria-label="Cartridge rack">
    <div class="flow" aria-label="Signal flows from left to right"><span>Input</span><i class="flow-line" aria-hidden="true"></i><span>Output</span></div>
    <div class="rack-scroll" id="rack-scroll"><div class="rack" id="rack"></div></div>
    <span class="visually-hidden" role="status" id="status"></span>
  </section>
  <section class="shelf" aria-label="Cartridge shelf">
    <div class="shelf-header"><h2>Cartridges</h2><span>8 effects</span></div>
    <div class="tray">
      <button class="shelf-arrow" id="prev" aria-label="Previous cartridges">‹</button>
      <div class="cartridges" id="cartridges"></div>
      <button class="shelf-arrow" id="next" aria-label="More cartridges">›</button>
    </div>
  </section>
</main>
<script>
"use strict";
const bank=[
  {id:"tape",name:"Tape",tone:"#e7a357",knobs:[["Depth",0,100,20,"%"],["Wow Rate",.1,3,.6,"Hz",.01],["Flutter",0,100,25,"%"],["Aged Color",0,100,23,"%"]]},
  {id:"tremolo",name:"Tremolo",tone:"#9bbc79",knobs:[["Depth",0,100,57,"%"],["Rate",.1,15,.5,"Hz",.01],["Shape",0,100,39,"%"]],modes:["Type A","Type B"]},
  {id:"saturation",name:"Saturation",tone:"#c2a1e7",knobs:[["Drive",0,30.9,4.7,"dB",.1],["Tone",0,100,50,"%"],["Mix",0,100,34,"%"]],modes:["Soft","Saturate"]},
  {id:"resampler",name:"Resampler",tone:"#dec05f",knobs:[["Rate",44,44100,11800,"Hz"],["Drive",0,12,1.7,"dB",.1],["Jitter",0,100,5,"%"]]},
  {id:"chorus",name:"Chorus",tone:"#72ccc2",knobs:[["Depth",0,100,34,"%"],["Rate",.01,5,.3,"Hz",.01],["Width",0,100,54,"%"],["Mix",0,100,26,"%"]],modes:["Triangle","Sine"]},
  {id:"delay",name:"Delay",tone:"#86b6eb",knobs:[["Feedback",0,100,37,"%"],["Saturation",0,18,3,"dB",.1],["Analog",0,100,16,"%"],["Mix",0,100,26,"%"]],modes:["1/16 Dotted","1/8","1/4"]},
  {id:"reverse",name:"Reverse",tone:"#e38caa",knobs:[["Forward",0,100,23,"%"],["Pitch",-12,12,0,"st"],["Mix",0,100,39,"%"]],modes:["1/8","1/4","1/2"],mode:1},
  {id:"reverb",name:"Reverb",tone:"#baa5e8",knobs:[["Decay",.1,15,4.8,"s",.1],["Pre Delay",0,200,31,"ms"],["Size",0,100,50,"%"],["Mix",0,100,30,"%"]],modes:["Room","Plate","Hall"],mode:2}
].map((effect,index)=>({...effect,index}));
const presets=[
  {name:"Initialize",chain:[]},
  {name:"Line Print",chain:["tape","saturation"]},
  {name:"Wide Reel",chain:["tape","chorus"]},
  {name:"Tape Repeat",chain:["tape","delay"]},
  {name:"Reverse Splice",chain:["reverse","delay"]},
  {name:"Hall Return",chain:["tape","chorus","reverb"]},
  {name:"Twin Echo",chain:[
    {effect:"delay",mode:0,values:{Feedback:27,Mix:22}},
    {effect:"delay",mode:2,values:{Feedback:42,Mix:31}}
  ]}
];
const byId = id => document.getElementById(id);
const lookup = new Map(bank.map(effect => [effect.id, effect]));
const rack = byId("rack"), rackScroll = byId("rack-scroll"), shelf = byId("cartridges");
const presetMenu = byId("presets"), status = byId("status");
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
let slots = [], dragged = null, nextId = 1;

function create(tag, klass, text) {
  const el = document.createElement(tag);
  if (klass) el.className = klass;
  if (text) el.textContent = text;
  return el;
}

function artwork(el, effect) {
  el.style.setProperty("--x", effect.index % 4 * 100 / 3 + "%");
  el.style.setProperty("--y", Math.floor(effect.index / 4) * 100 + "%");
  el.style.setProperty("--accent", effect.tone);
}

function beginDrag(event, id, origin) {
  if (!event.dataTransfer) return;
  dragged = { id, origin };
  event.dataTransfer.effectAllowed = origin === "slot" ? "move" : "copy";
  event.dataTransfer.setData("text/plain", String(id));
}

function endDrag() {
  dragged = null;
  rack.querySelectorAll(".over,.before,.after").forEach(el => el.classList.remove("over", "before", "after"));
}

function markPresetEdited() {
  presetMenu.value = "custom";
}

function makeSlot(config = null) {
  const settings = typeof config === "string" ? { effect: config } : config;
  return {
    id: nextId++,
    effect: settings?.effect ?? null,
    values: new Map(Object.entries(settings?.values ?? {})),
    mode: settings?.mode
  };
}

function appendSlot(effect = null) {
  const entry = makeSlot(effect);
  slots.push(entry);
  markPresetEdited();
  renderRack(entry.id);
  rackScroll.scrollTo({ left: rackScroll.scrollWidth, behavior: reducedMotion.matches ? "auto" : "smooth" });
  status.textContent = effect ? lookup.get(effect).name + " added to the rack" : "Empty slot added";
  return entry;
}

function fillSlot(entry, effect) {
  if (entry.effect === effect) return;
  entry.effect = effect;
  entry.values.clear();
  entry.mode = undefined;
  markPresetEdited();
  renderRack(entry.id);
  status.textContent = lookup.get(effect).name + " loaded";
}

function moveSlot(id, destination) {
  const from = slots.findIndex(entry => entry.id === id);
  if (from < 0 || from === destination) return;
  const [entry] = slots.splice(from, 1);
  slots.splice(destination, 0, entry);
  markPresetEdited();
  renderRack();
  status.textContent = "Slot moved to position " + (destination + 1);
}

function bindCartridgeDrop(target, onDrop) {
  target.addEventListener("dragover", event => {
    if (dragged?.origin !== "shelf") return;
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
    target.classList.add("over");
  });
  target.addEventListener("dragleave", event => {
    if (!(event.relatedTarget instanceof Node) || !target.contains(event.relatedTarget))
      target.classList.remove("over");
  });
  target.addEventListener("drop", event => {
    if (dragged?.origin !== "shelf") return;
    event.preventDefault();
    const { id } = dragged;
    endDrag();
    onDrop(id);
  });
}

function bindSlotReorder(shell, grip, entry, index) {
  grip.draggable = true;
  grip.addEventListener("dragstart", event => beginDrag(event, entry.id, "slot"));
  grip.addEventListener("dragend", endDrag);
  grip.addEventListener("keydown", event => {
    const next = index + (event.key === "ArrowLeft" ? -1 : event.key === "ArrowRight" ? 1 : 0);
    if (next === index || next < 0 || next >= slots.length) return;
    event.preventDefault();
    moveSlot(entry.id, next);
    rack.querySelector('[data-slot="' + entry.id + '"] .grip').focus();
  });
  const isAfter = event => event.clientX >= shell.getBoundingClientRect().left + shell.offsetWidth / 2;
  shell.addEventListener("dragover", event => {
    if (dragged?.origin !== "slot" || dragged.id === entry.id) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = "move";
    const after = isAfter(event);
    shell.classList.toggle("before", !after);
    shell.classList.toggle("after", after);
  });
  shell.addEventListener("dragleave", event => {
    if (!(event.relatedTarget instanceof Node) || !shell.contains(event.relatedTarget))
      shell.classList.remove("before", "after");
  });
  shell.addEventListener("drop", event => {
    if (dragged?.origin !== "slot" || dragged.id === entry.id) return;
    event.preventDefault();
    const { id } = dragged;
    const from = slots.findIndex(candidate => candidate.id === id);
    const to = index + Number(isAfter(event)) - Number(from < index);
    endDrag();
    moveSlot(id, to);
  });
}

function makeDrawer(entry, effect, index) {
  const drawer = create("div", "drawer");
  drawer.style.setProperty("--accent", effect.tone);
  const head = create("div", "drawer-head"), title = create("div", "module-name");
  title.append(create("span", "dot"), create("h2", "", effect.name));
  head.append(title);
  if (effect.modes) {
    const mode = create("select", "mode-select");
    mode.setAttribute("aria-label", effect.name + " mode, slot " + (index + 1));
    effect.modes.forEach((name, i) => mode.append(new Option(name, i)));
    mode.selectedIndex = entry.mode ?? effect.mode ?? 0;
    mode.addEventListener("change", () => {
      entry.mode = mode.selectedIndex;
      markPresetEdited();
    });
    head.append(mode);
  }
  const group = create("div", "controls");
  for (const [label, min, max, initial, unit, step = 1] of effect.knobs) {
    const control = create("label", "dial"), ring = create("span", "ring"), cap = create("span", "cap");
    const input = create("input"), readout = create("output");
    input.type = "range";
    input.min = min;
    input.max = max;
    input.step = step;
    input.value = entry.values.get(label) ?? initial;
    input.dataset.param = label;
    input.setAttribute("aria-label", effect.name + " " + label + ", slot " + (index + 1));
    const paint = () => {
      const n = Number(input.value), pos = (n - min) / (max - min);
      ring.style.setProperty("--fill", pos * 77 + "%");
      ring.style.setProperty("--needle", (pos * 276 - 138) + "deg");
      readout.textContent = n + (unit === "%" ? "%" : " " + unit);
      input.setAttribute("aria-valuetext", readout.textContent);
    };
    input.addEventListener("input", () => {
      entry.values.set(label, Number(input.value));
      markPresetEdited();
      paint();
    });
    cap.setAttribute("aria-hidden", "true");
    ring.append(cap, input);
    control.append(ring, create("span", "", label), readout);
    group.append(control);
    paint();
  }
  drawer.append(head, group);
  return drawer;
}

function makeSlotView(entry, index, animateId) {
  const effect = lookup.get(entry.effect);
  const shell = create("article", "slot-shell");
  shell.dataset.slot = entry.id;
  shell.dataset.effect = entry.effect ?? "";
  const slot = create("div", "slot");
  const label = create("div", "slot-label");
  const grip = create("button", "grip", "⠿"), remove = create("button", "", "×");
  grip.setAttribute("aria-label", "Move slot " + (index + 1));
  grip.title = "Drag to reorder, or use the left and right arrows";
  remove.setAttribute("aria-label", "Remove slot " + (index + 1));
  remove.addEventListener("click", () => {
    slots.splice(index, 1);
    markPresetEdited();
    renderRack();
    status.textContent = "Slot removed";
  });
  label.append(grip, create("span", "", "Slot " + (index + 1)), remove);
  const mouth = create("div", "mouth");
  slot.append(label, mouth);
  shell.append(slot);
  bindCartridgeDrop(slot, id => fillSlot(entry, id));
  bindSlotReorder(shell, grip, entry, index);
  if (!effect) {
    mouth.append(create("span", "slot-hint", "Drag a cartridge here"));
    return shell;
  }
  const mounted = create("div", "mounted"), cover = create("div", "art mount-art");
  artwork(cover, effect);
  cover.append(create("strong", "", effect.name));
  mounted.append(create("span", "mount-grip"), cover);
  mouth.append(mounted);
  const drawer = makeDrawer(entry, effect, index);
  shell.append(drawer);
  if (animateId === entry.id && !reducedMotion.matches) {
    drawer.animate([
      { transform:"translateY(47px) scaleY(.93)", opacity:0, clipPath:"inset(0 0 90% 0)" },
      { transform:"translateY(0) scaleY(1)", opacity:1, clipPath:"inset(0 0 0 0)" }
    ], { duration:340, easing:"cubic-bezier(.18,.7,.26,1)" });
    mounted.animate([
      { transform:"translateY(-23px)", opacity:.6 },
      { transform:"translateY(9px)", opacity:1 }
    ], { duration:190, easing:"cubic-bezier(.19,.73,.32,1)" });
  }
  return shell;
}

function renderRack(animateId) {
  if (!slots.length) {
    const empty = create("div", "empty-rack", "Drag a cartridge here");
    bindCartridgeDrop(empty, appendSlot);
    rack.replaceChildren(empty);
    return;
  }
  const add = create("button", "add-slot");
  add.setAttribute("aria-label", "Add cartridge slot");
  const plus = create("span", "plus", "+");
  plus.setAttribute("aria-hidden", "true");
  add.append(plus, create("span", "add-caption", "Add slot"));
  add.addEventListener("click", () => {
    appendSlot();
    rack.querySelector(".add-slot").focus({ preventScroll:true });
  });
  bindCartridgeDrop(add, appendSlot);
  rack.replaceChildren(...slots.map((slot, index) => makeSlotView(slot, index, animateId)), add);
}

for (const effect of bank) {
  const cartridge = create("button", "cartridge"), cover = create("span", "art label-art");
  cartridge.dataset.effect = effect.id;
  cartridge.draggable = true;
  cartridge.setAttribute("aria-label", "Load " + effect.name + " cartridge");
  artwork(cartridge, effect);
  cartridge.append(create("span", "case-grip"), cover, create("span", "cart-name", effect.name));
  cartridge.addEventListener("click", () => {
    const empty = slots.find(entry => !entry.effect);
    if (empty) fillSlot(empty, effect.id);
    else appendSlot(effect.id);
  });
  cartridge.addEventListener("dragstart", event => beginDrag(event, effect.id, "shelf"));
  cartridge.addEventListener("dragend", endDrag);
  shelf.append(cartridge);
}

const prev = byId("prev"), next = byId("next");
function updateArrows() {
  prev.disabled = shelf.scrollLeft <= 1;
  next.disabled = shelf.scrollLeft + shelf.clientWidth >= shelf.scrollWidth - 1;
}
for (const [button, sign] of [[prev, -1], [next, 1]]) {
  button.addEventListener("click", () => shelf.scrollBy({
    left: sign * shelf.clientWidth * .66,
    behavior: reducedMotion.matches ? "auto" : "smooth"
  }));
}
shelf.addEventListener("scroll", updateArrows, { passive:true });
new ResizeObserver(updateArrows).observe(shelf);

function loadPreset(index) {
  const preset = presets[index];
  if (!preset) return;
  endDrag();
  slots = preset.chain.map(makeSlot);
  presetMenu.value = String(index);
  renderRack();
  rackScroll.scrollLeft = 0;
}

presets.forEach((preset, i) => presetMenu.append(new Option(preset.name, i)));
const custom = new Option("Custom", "custom");
custom.disabled = true;
presetMenu.append(custom);
presetMenu.addEventListener("change", () => loadPreset(Number(presetMenu.value)));
byId("generate").addEventListener("click", () => {
  const choices = presets.slice(1).map((_, i) => i + 1).filter(i => String(i) !== presetMenu.value);
  loadPreset(choices[Math.floor(Math.random() * choices.length)]);
  status.textContent = presetMenu.options[presetMenu.selectedIndex].text + " loaded";
});
loadPreset(0);
updateArrows();

</script>
</html>
